version = 1

# Licensing of the files that carry no SPDX header of their own, as the REUSE
# specification 3.3 describes. A file that has a header keeps it: with the
# default precedence ("closest") an annotation applies only to a file without
# one. Where several annotations match a file, the last one applies.
#
# The project's own files are MIT (LICENSE) and copyright University of Tartu,
# as LICENSE says. The source files of the project carry their header in the
# file. This file annotates what cannot carry a comment or is better annotated
# in bulk. The maintainers should confirm the holder and the years.

SPDX-PackageName = "CoOpeRace"
SPDX-PackageDownloadLocation = "https://github.com/sws-lab/cooperace"

[[annotations]]
path = [
    ".gitattributes",
    ".gitignore",
    ".github/**",
    "README.md",
    "REUSE.toml",
    "pyproject.toml",
    "conf/**",
    "tools.txt",
    "tools-pool.txt",
    "tools-options.json",
    "src/tool_combinations/README.md",
    "svcomp2025_results/README.md",
    "tests/Race.set",
    "tests/table-generator.xml",
    "tests/table-generator_combinations.xml",
    "tests/bench-defs/**",
    "tests/integration/README.md",
    "tests/integration/manifest.json",
    "tests/integration/conf/**",
    "tests/svcomp25-no-data-race/README.md",
]
SPDX-FileCopyrightText = "2024-2026 University of Tartu"
SPDX-License-Identifier = "MIT"

# Task definitions and set files copied from the SV-Benchmarks collection. Its
# .reuse/dep5 (tag svcomp26) puts c/*/*.yml under CC0-1.0, copyright
# "2011-2020 The SV-Benchmarks Community".
[[annotations]]
path = [
    "tests/no-data-race/*.yml",
    "tests/svcomp25-no-data-race/*.yml",
    "tests/integration/c/*/*.yml",
]
SPDX-FileCopyrightText = "2011-2020 The SV-Benchmarks Community"
SPDX-License-Identifier = "CC0-1.0"

# Property files copied from the SV-Benchmarks collection (tests/properties has
# a .license file for each; this one has none).
[[annotations]]
path = "tests/integration/c/properties/*.prp"
SPDX-FileCopyrightText = "2011-2020 The SV-Benchmarks Community"
SPDX-License-Identifier = "Apache-2.0"

# Preprocessed sources of SV-COMP 2025 tasks that lost the header of the
# original file in preprocessing. SV-Benchmarks (tag svcomp26, .reuse/dep5)
# puts c/pthread-ext/ under LicenseRef-unknown and the other directories these
# files come from (c/pthread-wmm, c/pthread-atomic, c/pthread-driver-races,
# c/pthread-lit, c/pthread-complex, c/pthread-nondet, c/pthread-C-DAC,
# c/pthread-divine, c/ldv-races, c/ldv-linux-3.14-races) under
# LicenseRef-in-text-file, with the copyright unknown. The original .c files
# there carry no header either. The two LicenseRef texts are those of
# SV-Benchmarks.
[[annotations]]
path = "tests/svcomp25-no-data-race/*.i"
SPDX-FileCopyrightText = "unknown: the SV-Benchmarks collection does not record the authors of these files"
SPDX-License-Identifier = "LicenseRef-in-text-file"

