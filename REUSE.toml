# Preprocessed sources of tasks in tests/integration/c; the licenses are those
# the manifest records for the task's directory, with the texts in LICENSES/.
[[annotations]]
path = "tests/integration/c/pthread-divine/*.i"
SPDX-FileCopyrightText = "The authors of the DIVINE tests, https://divine.fi.muni.cz"
SPDX-License-Identifier = "ISC"

[[annotations]]
path = "tests/integration/c/ldv-races/*.i"
SPDX-FileCopyrightText = "The authors of the Linux Driver Verification races benchmarks"
SPDX-License-Identifier = "GPL-2.0-only"

# The two programs written for this repository's integration suite.
[[annotations]]
path = "tests/integration/c/lp64/*"
SPDX-FileCopyrightText = "2024-2026 University of Tartu"
SPDX-License-Identifier = "MIT"

# The bundled BenchExec wheel and the license texts that scripts/download-
# benchexec.py extracted from it (benchexec-*.whl.license). The wheel is
# third-party: BenchExec is Apache-2.0, and its license files cover the
# further licenses listed here. "override" because the .license file beside the
# wheel holds license texts, not SPDX tags.
[[annotations]]
path = "lib/benchexec-*"
precedence = "override"
SPDX-FileCopyrightText = "Dirk Beyer and the BenchExec contributors"
SPDX-License-Identifier = "Apache-2.0 AND BSD-3-Clause AND CC-BY-4.0 AND ISC AND LicenseRef-BSD-3-Clause-CMU AND MIT"

# SV-COMP 2025 result files (bzip2-compressed BenchExec result XML), published
# by the competition under CC-BY-4.0.
[[annotations]]
path = "svcomp2025_results/*.bz2"
SPDX-FileCopyrightText = "SV-COMP 2025 organizers and participants"
SPDX-License-Identifier = "CC-BY-4.0"
